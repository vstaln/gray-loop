[package]
name = "gray-loop"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "/loop [interval] <prompt> — scheduled and self-paced loops, plus /loop goal checklist loops"

[[bin]]
name = "gray-loop"
path = "src/main.rs"

[dependencies]
serde_json = "1"
gray-questions = { git = "https://github.com/vstaln/gray-questions", tag = "v0.1.1" }

[profile.release]
strip = true

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
